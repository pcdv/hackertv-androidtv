name: Release

# A tag such as v0.2.0 builds a signed APK, attests where it came from and publishes a GitHub
# release. A manual run does the same build and attestation but publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write       # create the release
  id-token: write       # sign the attestation
  attestations: write   # store the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="${REF_NAME#v}"
          # A manual run on a branch has no version tag: build as a snapshot.
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="0.0.0-$GITHUB_SHA"
          ./gradlew assembleRelease -PversionName="${version:0:32}" -PversionCode="$RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "hackertv-androidtv-${version:0:32}.apk"
          echo "APK=hackertv-androidtv-${version:0:32}.apk" >> "$GITHUB_ENV"

      - name: Check the signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$APK"

      - name: Checksum
        run: sha256sum "$APK" | tee "$APK.sha256"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.APK }}

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          generate_release_notes: true
          body: |
            Verify the download: `gh attestation verify ${{ env.APK }} --repo ${{ github.repository }}`
